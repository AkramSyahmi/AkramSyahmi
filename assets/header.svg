<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Muhammad Akram Syahmi. Software Engineering student at UMPSA. Full-stack, mobile and ML.">
  <defs>
    <radialGradient id="aura1" cx="20%" cy="10%" r="60%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="90%" cy="100%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".25"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
      .tag rect { fill: #161b22; stroke: #30363d; }
      .tag text { fill: #c9d1d9; font-size: 13px; }
      @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(30px,12px) } }
      .a1 { animation: drift 9s ease-in-out infinite; }
      .a2 { animation: drift 11s ease-in-out infinite reverse; }
      @media (prefers-reduced-motion: reduce) { .a1, .a2 { animation: none; } }
    </style>
  </defs>

  <rect width="900" height="240" rx="16" fill="#0d1117"/>
  <rect class="a1" x="-100" y="-80" width="1100" height="400" fill="url(#aura1)"/>
  <rect class="a2" x="-100" y="-80" width="1100" height="400" fill="url(#aura2)"/>
  <rect x=".5" y=".5" width="899" height="239" rx="15.5" fill="none" stroke="#30363d"/>

  <text x="40" y="58" class="mono" font-size="14" fill="#58a6ff">&gt; whoami</text>
  <text x="40" y="104" font-size="38" font-weight="700" fill="#f0f6fc">Muhammad Akram Syahmi</text>
  <text x="40" y="136" font-size="17" fill="#8b949e">Software Engineering @ UMPSA · Full-stack, mobile &amp; ML · SAP Certified</text>

  <g transform="translate(40,166)">
    <g class="tag"><rect width="74" height="28" rx="14"/><text x="37" y="19" text-anchor="middle">Python</text></g>
    <g class="tag" transform="translate(84,0)"><rect width="100" height="28" rx="14"/><text x="50" y="19" text-anchor="middle">TypeScript</text></g>
    <g class="tag" transform="translate(194,0)"><rect width="64" height="28" rx="14"/><text x="32" y="19" text-anchor="middle">React</text></g>
    <g class="tag" transform="translate(268,0)"><rect width="74" height="28" rx="14"/><text x="37" y="19" text-anchor="middle">Next.js</text></g>
    <g class="tag" transform="translate(352,0)"><rect width="78" height="28" rx="14"/><text x="39" y="19" text-anchor="middle">Laravel</text></g>
    <g class="tag" transform="translate(440,0)"><rect width="74" height="28" rx="14"/><text x="37" y="19" text-anchor="middle">Flutter</text></g>
    <g class="tag" transform="translate(524,0)"><rect width="70" height="28" rx="14"/><text x="35" y="19" text-anchor="middle">Godot</text></g>
    <g class="tag" transform="translate(604,0)"><rect width="78" height="28" rx="14"/><text x="39" y="19" text-anchor="middle">XGBoost</text></g>
  </g>

  <text x="860" y="58" class="mono" font-size="13" fill="#2dd4bf" text-anchor="end">● open to internships · Feb–Aug 2027</text>
</svg>
