name: Solar cards

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths: ['solar/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node solar/build.mjs --check && node solar/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git add assets/solar
          git diff --cached --quiet || (git commit -m 'Update solar cards' && git push)
